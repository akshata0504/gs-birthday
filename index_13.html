<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G's Birthday Countdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blush:#f6e4de;
    --cream:#f2e2d8;
    --paper:#fdf8f3;
    --pink:#e8a9a0;
    --pink-deep:#d97e82;
    --pink-dark:#7a3b3f;
    --brown:#6b4a3a;
    --brown-deep:#4a3226;
    --tape:#e8cdb0;
    --white:#ffffff;
    --shadow: rgba(74,50,38,0.18);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Poppins', sans-serif;
    background:
      radial-gradient(circle at 10% 15%, #f0d9cd 0%, transparent 45%),
      radial-gradient(circle at 90% 10%, #ecd3c8 0%, transparent 45%),
      radial-gradient(circle at 50% 90%, #f3ddd2 0%, transparent 55%),
      linear-gradient(180deg, var(--cream) 0%, var(--blush) 50%, var(--cream) 100%);
    background-attachment:fixed;
    color:var(--brown-deep);
    overflow-x:hidden;
    position:relative;
  }

  section{
    max-width:920px;
    margin:0 auto;
    padding: clamp(2rem, 6vw, 4.5rem) clamp(1.2rem, 4vw, 2rem);
    text-align:center;
    position:relative;
    z-index:1;
  }

  .divider{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:0.8rem;
    margin: 0.5rem auto 2rem;
    max-width:300px;
  }
  .divider .line{
    flex:1;
    height:1px;
    background: linear-gradient(90deg, transparent, var(--pink), transparent);
  }
  .divider svg{
    width:22px;
    height:22px;
    flex-shrink:0;
  }

  .deco{
    position:absolute;
    pointer-events:none;
    z-index:0;
  }
  .deco-hero-left{ width:90px; top:10px; left:-10px; transform:rotate(-12deg); }
  .deco-hero-right{ width:90px; top:10px; right:-10px; transform:rotate(12deg) scaleX(-1); }
  .deco-card-corner{ width:70px; top:-30px; left:-20px; transform:rotate(-18deg); z-index:2; }


  /* ===== HERO ===== */
  .hero{ padding-top: clamp(3.5rem, 9vw, 6rem); position:relative; }
  .hero .eyebrow{
    font-size: clamp(0.7rem, 2vw, 0.9rem);
    letter-spacing:0.3rem;
    text-transform:uppercase;
    color:var(--brown);
    font-weight:600;
    margin-bottom:0.6rem;
  }
  .hero h1{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size: clamp(3rem, 9vw, 5.5rem);
    color:var(--pink-dark);
    line-height:1;
    transform: rotate(-2deg);
    display:inline-block;
  }
  .hero p{
    font-size: clamp(0.95rem, 2.2vw, 1.15rem);
    margin-top:1.3rem;
    color:var(--brown-deep);
    max-width:480px;
    margin-left:auto;
    margin-right:auto;
    line-height:1.7;
  }
  .flowers{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: clamp(0.6rem, 2vw, 1.2rem);
    margin-top:1.8rem;
  }

  /* ===== SCRAPBOOK CARD (shared) ===== */
  .scrap-card{
    background: var(--paper);
    border-radius: 4px;
    box-shadow: 0 18px 40px var(--shadow);
    position:relative;
    padding: clamp(1.6rem, 5vw, 2.6rem);
    transition: transform 0.35s ease, box-shadow 0.35s ease;
  }
  .scrap-card:hover{
    transform: scale(1.03);
    box-shadow: 0 24px 50px var(--shadow);
  }
  .scrap-card::before{
    content:"";
    position:absolute;
    inset:10px;
    border:1px dashed rgba(122,59,63,0.25);
    pointer-events:none;
  }

  /* ===== COUNTDOWN ===== */
  .countdown-box{
    transform: rotate(-0.6deg);
    transition: transform 0.35s ease, box-shadow 0.35s ease;
  }
  .countdown-box:hover{
    transform: rotate(-0.6deg) scale(1.03);
  }
  .countdown-box h2{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size: clamp(1.8rem, 4vw, 2.6rem);
    color:var(--pink-dark);
    margin-bottom:1.6rem;
    transform: rotate(1deg);
  }
  .timer{
    display:flex;
    justify-content:center;
    gap: clamp(0.5rem, 2.2vw, 1.3rem);
    flex-wrap:wrap;
  }
  .time-unit{
    background: var(--white);
    border-radius:6px;
    padding: clamp(0.8rem,3vw,1.4rem) clamp(0.9rem,3.6vw,1.8rem);
    min-width: clamp(68px, 18vw, 105px);
    box-shadow: 0 6px 14px rgba(74,50,38,0.12);
    border: 1px solid var(--tape);
  }
  .time-unit .num{
    font-family:'Caveat', cursive;
    font-size: clamp(2rem, 6vw, 3rem);
    font-weight:700;
    color:var(--pink-dark);
    display:block;
    line-height:1;
  }
  .time-unit .label{
    font-size: clamp(0.65rem, 1.7vw, 0.8rem);
    color:var(--brown);
    text-transform:uppercase;
    letter-spacing:1.5px;
    font-weight:500;
  }
  .big-day{
    margin-top:1.6rem;
    font-family:'Caveat', cursive;
    font-size: clamp(1.6rem, 4.5vw, 2.4rem);
    color:var(--pink-dark);
    font-weight:bold;
  }
  .days-left-pill{
    display:inline-block;
    margin-top:1.4rem;
    background: var(--pink-deep);
    color:#fff;
    padding:0.45rem 1.3rem;
    border-radius:4px;
    font-size:0.8rem;
    font-weight:600;
    letter-spacing:0.5px;
    box-shadow: 0 6px 14px rgba(74,50,38,0.15);
    transform: rotate(-1deg);
  }

  /* ===== ARTIST OF THE DAY (polaroid style) ===== */
  .artists h2{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size: clamp(1.9rem, 4.2vw, 2.8rem);
    color:var(--pink-dark);
    margin-bottom: 0.3rem;
  }
  .artists .sub{
    font-size:0.8rem;
    color:var(--brown);
    letter-spacing:0.15rem;
    text-transform:uppercase;
    margin-bottom:2rem;
    font-weight:600;
  }
  .polaroid{
    background: var(--white);
    padding: 16px 16px 60px;
    box-shadow: 0 15px 35px var(--shadow);
    display:inline-block;
    max-width: clamp(280px, 60vw, 420px);
    width:100%;
    position:relative;
    transform: rotate(-1.5deg);
    transition: transform 0.35s ease, box-shadow 0.35s ease;
  }
  .polaroid:hover{
    transform: rotate(-1.5deg) scale(1.05);
    box-shadow: 0 22px 45px var(--shadow);
  }
  .polaroid img{
    width:100%;
    aspect-ratio: 4/5;
    object-fit:cover;
    object-position: top center;
    display:block;
    background: var(--cream);
  }
  .polaroid .day-tag{
    position:absolute;
    top:-12px;
    left:-12px;
    background: var(--pink-deep);
    color:#fff;
    font-size:0.7rem;
    font-weight:600;
    letter-spacing:1px;
    padding:0.3rem 0.9rem;
    border-radius:4px;
    transform: rotate(-4deg);
    box-shadow: 0 4px 10px rgba(74,50,38,0.2);
  }
  .polaroid p{
    font-family:'Caveat', cursive;
    font-size: clamp(1.4rem, 3.2vw, 1.9rem);
    font-weight:700;
    color:var(--pink-dark);
    position:absolute;
    bottom:14px;
    left:0;
    right:0;
    text-align:center;
  }
  .artist-strip{
    margin-top:2.2rem;
    display:flex;
    gap:0.5rem;
    flex-wrap:wrap;
    justify-content:center;
  }
  .artist-strip span{
    width:9px;
    height:9px;
    border-radius:50%;
    background: var(--tape);
    display:inline-block;
  }
  .artist-strip span.done{ background: var(--pink-deep); }
  .artist-strip span.today{
    background: var(--brown);
    transform:scale(1.5);
  }

  footer{
    text-align:center;
    padding: 2.5rem 1rem;
    font-size:0.85rem;
    color:var(--pink-dark);
    font-family:'Caveat', cursive;
    font-size:1.3rem;
    position:relative;
    z-index:1;
  }

</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="petalGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eab8b0"/>
      <stop offset="100%" stop-color="#d97e82"/>
    </linearGradient>

    <symbol id="ic-flower" viewBox="0 0 60 60">
      <g>
        <ellipse cx="30" cy="14" rx="9" ry="15" fill="url(#petalGrad)"/>
        <ellipse cx="30" cy="14" rx="9" ry="15" fill="url(#petalGrad)" transform="rotate(72 30 30)"/>
        <ellipse cx="30" cy="14" rx="9" ry="15" fill="url(#petalGrad)" transform="rotate(144 30 30)"/>
        <ellipse cx="30" cy="14" rx="9" ry="15" fill="url(#petalGrad)" transform="rotate(216 30 30)"/>
        <ellipse cx="30" cy="14" rx="9" ry="15" fill="url(#petalGrad)" transform="rotate(288 30 30)"/>
        <circle cx="30" cy="30" r="6" fill="#d99a4e"/>
        <circle cx="30" cy="30" r="6" fill="#d99a4e" opacity="0.6" r="3"/>
      </g>
    </symbol>

    <symbol id="ic-sprig" viewBox="0 0 120 210">
      <path d="M60 205 C 54 160, 66 110, 60 55" stroke="#6b4a3a" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M60 150 C 40 142, 22 122, 32 105 C 48 110, 62 130, 60 150 Z" fill="#8fa377"/>
      <path d="M60 110 C 80 102, 98 82, 88 65 C 72 70, 58 90, 60 110 Z" fill="#7c9468"/>
      <use href="#ic-flower" x="30" y="0" width="60" height="60"/>
    </symbol>
  </defs>
</svg>

<!-- HERO -->
<section class="hero">
  <svg class="deco deco-hero-left" viewBox="0 0 120 210"><use href="#ic-sprig"/></svg>
  <svg class="deco deco-hero-right" viewBox="0 0 120 210"><use href="#ic-sprig"/></svg>
  <div class="eyebrow">A little something for</div><br>
  <h1>happy birthday, G</h1>
  <div class="flowers">
    <svg viewBox="0 0 60 60" style="width:34px;"><use href="#ic-flower"/></svg>
    <svg viewBox="0 0 60 60" style="width:34px;"><use href="#ic-flower"/></svg>
    <svg viewBox="0 0 60 60" style="width:34px;"><use href="#ic-flower"/></svg>
  </div>
</section>

<div class="divider"><span class="line"></span><svg viewBox="0 0 60 60"><use href="#ic-flower"/></svg><span class="line"></span></div>

<!-- COUNTDOWN -->
<section class="countdown">
  <div class="scrap-card countdown-box">
    <svg class="deco deco-card-corner" viewBox="0 0 120 210"><use href="#ic-sprig"/></svg>
    <h2 id="countdown-heading">counting down to G's big day</h2>
    <div class="timer" id="timer">
      <div class="time-unit"><span class="num" id="days">--</span><span class="label">Days</span></div>
      <div class="time-unit"><span class="num" id="hours">--</span><span class="label">Hours</span></div>
      <div class="time-unit"><span class="num" id="minutes">--</span><span class="label">Minutes</span></div>
      <div class="time-unit"><span class="num" id="seconds">--</span><span class="label">Seconds</span></div>
    </div>
    <div class="big-day" id="big-day-message" style="display:none;">it's G's birthday!</div>
    <div class="days-left-pill" id="days-pill" style="display:none;"></div>
  </div>
</section>

<div class="divider"><span class="line"></span><svg viewBox="0 0 60 60"><use href="#ic-flower"/></svg><span class="line"></span></div>

<!-- ARTIST OF THE DAY -->
<section class="artists">
  <h2>artist of the day</h2>
  <div class="sub">25 days, 25 favorites</div>
  <div class="polaroid" style="position:relative;">
    <div class="day-tag" id="artist-day-tag">Day 0</div>
    <img id="artist-img" src="" alt="Artist of the day">
    <p id="artist-name">Loading...</p>
  </div>
  <div class="artist-strip" id="artist-strip"></div>
</section>

<footer></footer>

<script>
/* ============================
   CONFIG
   ============================ */

const BIRTHDAY_MONTH = 8;
const BIRTHDAY_DAY = 28;
const BIRTHDAY_YEAR = 2026;
const COUNTDOWN_LENGTH = 26;

// Real photos go here as they're uploaded to the "images" folder in the repo.
// Artists without a real photo yet fall back to a placeholder.
const REAL_PHOTOS = {
  1: "images/day1.jpeg",
  2: "images/day2.jpeg",
  3: "images/day3.jpeg",
  4: "images/day4.jpeg",
  5: "images/day5.jpeg",
  6: "images/day6.jpeg",
  7: "images/day7.jpeg",
  8: "images/day8.jpeg",
  9: "images/day9.jpeg",
  10: "images/day10.jpeg"
};

const ARTISTS = Array.from({length: 25}, (_, i) => {
  const n = i + 1;
  return {
    name: `Artist ${n}`,
    img: REAL_PHOTOS[n] || `https://picsum.photos/seed/artist${n}/300/300`
  };
});


/* ============================
   ARIZONA TIME HELPERS (fixed UTC-7, no DST)
   ============================ */

function getBirthdayTargetUTC() {
  return new Date(Date.UTC(BIRTHDAY_YEAR, BIRTHDAY_MONTH - 1, BIRTHDAY_DAY, 7, 0, 0));
}

function daysRemaining() {
  const now = new Date();
  const target = getBirthdayTargetUTC();
  const diffMs = target.getTime() - now.getTime();
  return Math.max(0, Math.ceil(diffMs / 86400000));
}

/* ============================
   COUNTDOWN TICK
   ============================ */
function updateCountdown() {
  const now = new Date();
  const target = getBirthdayTargetUTC();
  const diff = target.getTime() - now.getTime();

  const daysEl = document.getElementById('days');
  const hoursEl = document.getElementById('hours');
  const minsEl = document.getElementById('minutes');
  const secsEl = document.getElementById('seconds');
  const bigDayMsg = document.getElementById('big-day-message');
  const timer = document.getElementById('timer');
  const pill = document.getElementById('days-pill');

  if (diff <= 0) {
    timer.style.display = 'none';
    pill.style.display = 'none';
    bigDayMsg.style.display = 'block';
    document.getElementById('countdown-heading').textContent = "today is the day!";
    return;
  }

  const totalSeconds = Math.floor(diff / 1000);
  const days = Math.floor(totalSeconds / 86400);
  const hours = Math.floor((totalSeconds % 86400) / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;

  daysEl.textContent = days;
  hoursEl.textContent = String(hours).padStart(2, '0');
  minsEl.textContent = String(minutes).padStart(2, '0');
  secsEl.textContent = String(seconds).padStart(2, '0');

  pill.style.display = 'inline-block';
  pill.textContent = `${days} day${days === 1 ? '' : 's'} to go`;
}

/* ============================
   ARTIST OF THE DAY
   ============================ */
function renderArtistOfDay() {
  const remaining = daysRemaining();
  const artistSection = document.querySelector('.artists');

  // On the birthday itself, no photo — hide the artist section entirely
  if (remaining <= 0) {
    if (artistSection) artistSection.style.display = 'none';
    return;
  }
  if (artistSection) artistSection.style.display = '';

  let dayIndex = COUNTDOWN_LENGTH - remaining;
  if (dayIndex < 0) dayIndex = 0;
  if (dayIndex > COUNTDOWN_LENGTH - 1) dayIndex = COUNTDOWN_LENGTH - 1;

  // Day 0 and Day 1 both show Artist 1; from Day 2 onward each day maps to the next artist
  let artistIndex = dayIndex <= 1 ? 0 : dayIndex - 1;
  if (artistIndex > ARTISTS.length - 1) artistIndex = ARTISTS.length - 1;

  const artist = ARTISTS[artistIndex];
  document.getElementById('artist-day-tag').textContent = `Day ${dayIndex}`;
  document.getElementById('artist-img').src = artist.img;
  document.getElementById('artist-img').alt = artist.name;
  document.getElementById('artist-name').textContent = artist.name;

  const strip = document.getElementById('artist-strip');
  strip.innerHTML = ARTISTS.map((_, i) => {
    let cls = '';
    if (i < artistIndex) cls = 'done';
    if (i === artistIndex) cls = 'today';
    return `<span class="${cls}"></span>`;
  }).join('');
}

/* ============================
   INIT
   ============================ */
renderArtistOfDay();
updateCountdown();
setInterval(updateCountdown, 1000);
setInterval(renderArtistOfDay, 60000);
</script>

</body>
</html>
