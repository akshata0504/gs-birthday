name: Daily Birthday Countdown Email

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch: {}

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Send daily surprise email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "Knock knock!!!"
          to: ${{ secrets.RECIPIENT_EMAIL }}
          from: Akshata
          body: |
            Hey Brother,

            Time to check who’s waiting for you!🤭

            https://akshata0504.github.io/gs-birthday/
